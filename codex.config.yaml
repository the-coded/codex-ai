ai:
  default_model: claude_4_sonnet
  fallback_models:
  - claude_3_7_sonnet
  - claude_3_5_sonnet
  max_tokens: 180000
  retry_attempts: 3
  timeout: 120
git:
  exclude_patterns:
  - '*.lock'
  - dist/**
  - node_modules/**
  timeout: 30
output:
  default_format: markdown
  directory: .tmp
  verbose: false
performance:
  cache_enabled: true
  parallel_processing: true
