[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-ai"
version = "1.0.0"
description = "AI-powered development toolkit for changelog generation, documentation, and code analysis"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Codex-AI Team", email = "gabriel@laplanta.com.br"}
]
maintainers = [
    {name = "Codex-AI Team", email = "gabriel@laplanta.com.br"}
]
requires-python = ">=3.8"

# TODO: Adicionar classifiers quando necessário
classifiers = []

# Keywords essenciais
keywords = ["ai", "git", "changelog", "documentation", "code-analysis"]

dependencies = [
    # ═══ PROCESSAMENTO DE DADOS ═══
    "PyYAML>=6.0.2",           # Leitura/escrita YAML - configs, CI/CD, metadados
    
    # ═══ CONTROLE DE VERSÃO ═══  
    "GitPython>=3.1.44",       # Interface Python para Git - commits, branches, tags, diffs
    
    # ═══ INTELIGÊNCIA ARTIFICIAL ═══
    "anthropic>=0.55.0",       # API oficial Claude (Anthropic) - competitor do ChatGPT
    "aider-chat>=0.84.0",      # AI coding assistant - escreve código automaticamente
    "tiktoken>=0.9.0",         # Contador de tokens para APIs de IA (OpenAI/Anthropic)
    
    # ═══ TEMPLATES E FORMATAÇÃO ═══
    "jinja2>=3.1.6",           # Engine de templates - como Handlebars/Mustache no Node.js
    
    # ═══ UTILIDADES DE DATA/TEMPO ═══
    "python-dateutil>=2.9.0",  # Manipulação avançada de datas - como moment.js/date-fns
    
    # ═══ TIPAGEM E COMPATIBILIDADE ═══
    "typing-extensions>=4.13.0", # Recursos de tipagem para Python < 3.11
    "tomli>=2.2.0; python_version<'3.11'" # Parser TOML (built-in no Python 3.11+)
]

[project.urls]
Homepage = "https://github.com/the-coded/codex-ai"
Repository = "https://github.com/the-coded/codex-ai"
Documentation = "https://github.com/the-coded/codex-ai#readme"
"Bug Reports" = "https://github.com/the-coded/codex-ai/issues"

[project.scripts]
codex-ai = "cli:main"

[tool.setuptools]
packages = [
    "commands", "core", "core.git", "core.ai", "core.config",
    "constants", "utils", "templates", "templates.prompts"
]
py-modules = ["cli", "__main__"]

[tool.setuptools.package-data]
"templates" = ["**/*.md"]

# TODO: Implementar ferramentas de qualidade de código
# Configurações prontas para quando implementarmos ruff e mypy
# [tool.ruff] - Adicionar quando implementar
# [tool.mypy] - Adicionar quando implementar
